# Live engine on public data with SIMULATED fills (strict trade-through); no orders are sent.
# Units: price ticks of 0.1 USDT, quantity units of 0.0001 BTC, money atoms = tick x unit
# (1 atom = 0.00001 USDT). Thresholds are first estimates, NOT calibrated.

[environment]
window_ns = 500000000
shock_spread_ticks = 50
shock_min_top_qty = 10
chaotic_spread_changes = 400
trend_min_move_ticks = 50
trend_efficiency_ppm = 700000
trend_min_aggressive_qty = 10000
trend_aggression_ppm = 800000
active_min_moves = 2
active_min_prints = 2

[policy]
allowed_scopes = ["multi_venue", "market_wide"]
entry_levels = 1
entry_max_abs_net = 2
harvest_ticks = 5
rebalance_threshold_units = 1
rebalance_age_ns = 60000000000
rebalance_improve_ticks = 0
reprice_ticks = 5
evidence_ttl_ns = 1000000000
exit_on_environment = ["chaotic"]
mark_refresh_ns = 500000000
assess_interval_ns = 100000000

[fills]
rule = "strict_trade_through"
# Retail economics (docs/providers.md): makers PAY about 0.02%, takers about 0.05%.
# One child is 0.001 BTC (about 87 USDT), so 0.02% is about 0.0174 USDT = 1740 atoms.
maker_rebate_atoms = "0"
maker_fee_atoms = "1740"
taker_fee_atoms = "4340"
emergency_slippage_ticks = 1

[inventory]
venues = [1, 2, 3]
# Parent 0.01 BTC = 100 units; one child = 1/10 = 0.001 BTC.
parent_quantity = 100
quantum_numerator = 1
quantum_denominator = 10
target_units = 0
target_tolerance = 0
completion_max_gross = 0

[risk]
max_net_units = 4
max_gross_units = 8
max_venue_units = 6
max_target_deviation = 4
max_open_orders = 8
# 5 USDT liability, 20 USDT drawdown.
max_liability_atoms = "500000"
max_drawdown_atoms = "2000000"
max_position_age_ns = 300000000000
max_episode_ns = 600000000000
max_adverse_episodes = 5
mark_stale_ns = 2000000000
